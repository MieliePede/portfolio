services:
  frontend:
    build: ./frontend
    container_name: emile-portfolio-frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - internal
      - proxy

  backend:
    build: ./backend
    container_name: emile-portfolio-backend
    expose:
      - "8000"
    env_file: .env
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
  proxy:
    external: true
